[project]
name = "shogi-state-tracking"
version = "0.1.0"
description = "Decoder-only Transformer experiments for implicit shogi state tracking"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "cshogi @ git+https://github.com/akio-kobayashi/cshogi.git@c44708550d2dcd569179846a1ac35ad889d5ebb9",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
